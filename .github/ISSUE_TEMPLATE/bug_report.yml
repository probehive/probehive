name: Bug report
description: Report a reproducible problem in ProbeHive
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ProbeHive. Do not report security vulnerabilities here; follow SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
      placeholder: Tell us what you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the ProbeHive commit or version, operating system, browser if relevant, and deployment method.
      placeholder: |
        ProbeHive commit/version:
        Operating system:
        Browser:
        Deployment:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized logs or screenshots. Remove secrets, tokens, customer data, and private URLs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
