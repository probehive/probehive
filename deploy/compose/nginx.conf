worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $uri $probehive_log_path {
    ~^/api/v1/status-pages/ /api/v1/status-pages/[publication-token];
    ~^/status/ /status/[publication-token];
    default $uri;
  }

  log_format probehive '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $probehive_log_path $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

  # Referrers are omitted because public status pages carry their capability in the path.
  access_log /dev/stdout probehive;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    root /usr/share/nginx/html;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
      proxy_pass http://api:8080;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location = /readyz {
      proxy_pass http://api:8080;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location ^~ /api/v1/status-pages/ {
      # Error messages may include the request path, so discard them at this
      # capability-bearing boundary. Application errors use a redacted path.
      error_log /dev/null crit;
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
    }

    location ^~ /status/ {
      # The browser route carries the same read capability.
      error_log /dev/null crit;
      try_files $uri /index.html;
    }

    location /api/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
